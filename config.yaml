# ================= 策略组（总开关 + 订阅池 + 广告拦截） =================
proxy-groups:
  - {name: 节点选择, icon: "https://cdn.gh-proxy.org/https://github.com/musiyun124/mihomo/raw/refs/heads/main/icon2/Main.png", type: select, proxies: [DMIT-EB, 订阅-自动, 订阅-手选, DIRECT]}
  - {name: 订阅-自动, icon: "https://cdn.gh-proxy.org/https://github.com/musiyun124/mihomo/raw/refs/heads/main/icon2/Main.png", type: url-test, use: [qianlink], url: "http://www.gstatic.com/generate_204", interval: 300, tolerance: 100, lazy: true}
  - {name: 订阅-手选, icon: "https://cdn.gh-proxy.org/https://github.com/musiyun124/mihomo/raw/refs/heads/main/icon2/Main.png", type: select, use: [qianlink]}
  - {name: 广告拦截, icon: "https://cdn.gh-proxy.org/https://github.com/musiyun124/mihomo/raw/refs/heads/main/icon2/GGLJ.png", type: select, proxies: [PASS, REJECT, REJECT-DROP]}

# ================= 规则集锚点 =================
# proxy: DIRECT 是关键：下载必须直连，否则开机时代理还没起来会形成死循环
rule-anchor:
  IPCIDR: &IPCIDR {type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT}
  Domain: &Domain {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT}

# ================= 规则集（8 个，已预置 rules\ 目录） =================
rule-providers:
  Fake-IP-Filter: {<<: *Domain, path: ./rules/Fake-IP-Filter.mrs, url: "https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/fakeip-filter.mrs"}
  CN_IP:          {<<: *IPCIDR, path: ./rules/CN_IP.mrs,          url: "https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/cnip.mrs"}
  CN_域:          {<<: *Domain, path: ./rules/CN_域.mrs,          url: "https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/cn.mrs"}
  CN_Lite:        {<<: *Domain, path: ./rules/CN_Lite.mrs,        url: "https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/cn-lite.mrs"}
  FCM_域:         {<<: *Domain, path: ./rules/FCM_域.mrs,         url: "https://cdn.gh-proxy.org/https://github.com/musiyun124/mihomo/raw/refs/heads/main/rules/FCM.mrs"}
  No-ads-all_域:  {<<: *Domain, path: ./rules/No-ads-all.mrs,     url: "https://cdn.gh-proxy.org/https://github.com/217heidai/adblockfilters/raw/refs/heads/main/rules/adblockmihomo.mrs"}
  Private_域:     {<<: *Domain, path: ./rules/LAN.mrs,            url: "https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/private.mrs"}
  Private_IP:     {<<: *IPCIDR, path: ./rules/Private_IP.mrs,     url: "https://cdn.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/privateip.mrs"}

# ================= 路由规则（与模板同顺序，去掉单节点下无意义的应用分流） =================
rules:
  - DOMAIN-SUFFIX,googleapis.cn,节点选择
  - RULE-SET,Private_域,DIRECT
  - RULE-SET,Private_IP,DIRECT,no-resolve
  - RULE-SET,CN_Lite,DIRECT
  - RULE-SET,CN_IP,DIRECT,no-resolve
  - RULE-SET,No-ads-all_域,广告拦截
  - MATCH,节点选择
